[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-profile-studio"
version = "1.0.0"
description = "CLI and Tkinter studio for designing Discord Rich Presence and profile widgets."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "MattFor", email = "mattfor@relaxy.xyz" }, { name = "KamilKlimas" }]
keywords = ["discord", "rich-presence", "rpc", "tkinter", "cli", "customrp", "tray"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pypresence>=4.3",
    "platformdirs>=4.2",
    "pillow>=10.3",
    "pystray>=0.19",
    "keyring>=25.0",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "basedpyright>=1.13",
    "pre-commit>=3.7",
]

[project.scripts]
dps = "discord_profile_studio.cli.app:main"
discord-profile-studio = "discord_profile_studio.cli.app:main"

[project.gui-scripts]
discord-profile-studio-gui = "discord_profile_studio.gui.app:run"

[project.urls]
Homepage = "https://github.com/MattFor/discord-profile-studio"
Repository = "https://github.com/MattFor/discord-profile-studio"
Issues = "https://github.com/MattFor/discord-profile-studio/issues"
Changelog = "https://github.com/MattFor/discord-profile-studio/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_profile_studio"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "COM",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    "FA",
    "FBT",
    "I",
    "ICN",
    "ISC",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ANN401",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101", "S105", "S106", "SLF001"]
"src/discord_profile_studio/auth/**" = ["S105", "S106"]
"src/discord_profile_studio/core/config.py" = ["S105"]
"src/discord_profile_studio/cli/**" = [
    "FBT001",
    "FBT002",
    "FBT003",
    "B008",
    "PLR0913",
    "PLR0917",
    "UP007",
]

[tool.ruff.lint.isort]
known-first-party = ["discord_profile_studio"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "recommended"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnusedCallResult = "none"
reportAny = "none"
reportExplicitAny = "none"
reportImplicitOverride = "none"
reportMissingParameterType = "error"
reportUninitializedInstanceVariable = "none"
reportPrivateUsage = "error"
failOnWarnings = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gui: requires a display server",
    "discord: requires a running Discord client",
    "tray: requires a system tray",
    "windows: windows-only behaviour",
    "linux: linux-only behaviour",
]

[tool.coverage.run]
source = ["src/discord_profile_studio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
